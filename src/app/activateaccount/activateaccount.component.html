<div class="activate-page">
  <div class="activate-card">
    <!-- Decorative glow -->
    <div class="card-glow"></div>

    <div class="card-content">
      <div class="form-header">
        <div class="icon-badge">
          <i class="fas fa-shield-alt"></i>
        </div>
        <h1 class="form-title">Activate Account<span class="accent-dot">.</span></h1>
        <p class="form-subtitle">Enter the 6-digit code sent to your email</p>
      </div>

      <form [formGroup]="activationForm" (ngSubmit)="activateAccount()">
        <!-- Activation Code Field -->
        <div class="form-group">
          <label class="form-label" for="activationCode">Activation Code</label>
          <div class="input-wrapper">
            <i class="fas fa-key input-icon"></i>
            <input
              id="activationCode"
              type="text"
              class="form-input"
              placeholder="Enter 6-digit code"
              formControlName="activationCode"
              maxlength="6"
              minlength="6"
              required
              pattern="^[0-9]{6}$"
              [ngClass]="{
                'input-error': activationForm.get('activationCode')?.touched && activationForm.get('activationCode')?.invalid
              }"
            />
          </div>

          <!-- Validation Errors -->
          <div
            class="error-message"
            *ngIf="activationForm.get('activationCode')?.touched && activationForm.get('activationCode')?.invalid"
          >
            <i class="fas fa-exclamation-circle"></i>
            <span *ngIf="activationForm.get('activationCode')?.errors?.['required']">
              Activation code is required.
            </span>
            <span *ngIf="activationForm.get('activationCode')?.errors?.['minlength'] ||
                      activationForm.get('activationCode')?.errors?.['maxlength']">
              Code must be exactly 6 digits.
            </span>
            <span *ngIf="activationForm.get('activationCode')?.errors?.['pattern']">
              Only numbers are allowed.
            </span>
          </div>
        </div>

        <!-- Submit Button -->
        <button
          type="submit"
          class="submit-btn"
          [disabled]="activationForm.invalid || isActivating"
        >
          <span *ngIf="isActivating" class="btn-loading">
            <i class="fas fa-spinner fa-spin"></i> Activating...
          </span>
          <span *ngIf="!isActivating">Activate Account</span>
        </button>

        <!-- Success or Error Message -->
        <div
          *ngIf="activationMessage"
          class="alert-message"
          [ngClass]="{
            'alert-success': activationSuccess,
            'alert-error': !activationSuccess
          }"
        >
          <i class="fas" [ngClass]="{
            'fa-check-circle': activationSuccess,
            'fa-exclamation-triangle': !activationSuccess
          }"></i>
          {{ activationMessage }}
        </div>

        <!-- Back to Login -->
        <div class="alt-link">
          <a routerLink="/login"><i class="fas fa-arrow-left"></i> Back to Login</a>
        </div>
      </form>
    </div>
  </div>
</div>
