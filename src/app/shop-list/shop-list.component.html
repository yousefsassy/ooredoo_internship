<div class="page-container">
  <!-- Page Header -->
  <div class="page-header">
    <div>
      <h1 class="page-title">Shops</h1>
      <p class="page-subtitle">View and manage all shops</p>
    </div>
    <button class="btn-add" (click)="onAddShop()">
      <i class="fas fa-plus"></i> Add Shop
    </button>
  </div>

  <!-- Controls Bar -->
  <div class="controls-bar">
    <div class="search-box">
      <i class="fas fa-search"></i>
      <input
        type="text"
        placeholder="Search by shop name..."
        [(ngModel)]="searchTerm"
        (input)="onSearchChange()"
      />
    </div>
  </div>

  <!-- Table Card -->
  <div class="table-card">
    <div class="table-responsive">
      <table class="data-table" *ngIf="filteredShops.length > 0; else emptyState">
        <thead>
          <tr>
            <th>Shop Name</th>
            <th>Admin</th>
            <th>Phone</th>
            <th class="th-actions">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let shop of filteredShops">
            <td>
              <div class="shop-info">
                <div class="shop-icon">
                  <i class="fas fa-store"></i>
                </div>
                <span class="shop-name">{{ shop.nomShop }}</span>
              </div>
            </td>
            <td class="td-secondary">{{ getAdminShopName(shop) }}</td>
            <td class="td-secondary">{{ shop.telephone }}</td>
            <td>
              <div class="action-buttons">
                <button
                  class="action-btn"
                  (click)="onViewShop(shop.idShop!)"
                  title="View"
                >
                  <i class="fas fa-eye"></i>
                </button>
                <button
                  class="action-btn"
                  (click)="onEditShop(shop.idShop!)"
                  title="Edit"
                >
                  <i class="fas fa-pen"></i>
                </button>
                <button
                  class="action-btn action-btn-warning"
                  (click)="onArchiveShop(shop.idShop!)"
                  title="Archive"
                >
                  <i class="fas fa-archive"></i>
                </button>
                <button
                  class="action-btn action-btn-danger"
                  (click)="onDeleteShop(shop.idShop!)"
                  title="Delete"
                >
                  <i class="fas fa-trash"></i>
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <ng-template #emptyState>
      <div class="empty-state">
        <div class="empty-icon">
          <i class="fas fa-store"></i>
        </div>
        <h3>No shops found</h3>
        <p>Start by adding your first shop</p>
        <button class="btn-add" (click)="onAddShop()">
          <i class="fas fa-plus"></i> Add Shop
        </button>
      </div>
    </ng-template>
  </div>
</div>
