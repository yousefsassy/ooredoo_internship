<div *ngIf="shop" class="page-container">
  <div class="detail-header">
    <div class="detail-icon">
      <i class="fas fa-store"></i>
    </div>
    <div class="detail-header-info">
      <h1 class="detail-title">{{ shop.nomShop }}</h1>
    </div>
  </div>

  <div class="meta-grid">
    <div class="meta-item">
      <i class="fas fa-hashtag"></i>
      <div class="meta-content">
        <span class="meta-label">Shop ID</span>
        <span class="meta-value">{{ shop.idShop }}</span>
      </div>
    </div>

    <div class="meta-item">
      <i class="fas fa-user-tie"></i>
      <div class="meta-content">
        <span class="meta-label">Administrator</span>
        <span class="meta-value">{{ shop.adminShop?.username || 'N/A' }}</span>
      </div>
    </div>

    <div class="meta-item">
      <i class="fas fa-phone-alt"></i>
      <div class="meta-content">
        <span class="meta-label">Phone</span>
        <span class="meta-value">{{ shop.telephone }}</span>
      </div>
    </div>
  </div>
</div>
