<div class="zone-dashboard-wrapper">
  <div class="zone-container card shadow p-4" *ngIf="zone; else loadingOrError">
    <h2 class="text-center mb-4">📍 Your Assigned Zone</h2>
    
    <div class="row zone-details">
      <div class="detail-box">
        <strong>Label:</strong>
        <span>{{ zone.libelle }}</span>
      </div>
      <div class="detail-box">
        <strong>Governorate:</strong>
        <span>{{ zone.gouvernorat }}</span>
      </div>
    </div>
  </div>

  <!-- KPI Stats -->
  <div class="dashboard-cards" *ngIf="stats">
    <div class="kpi-card red">
      <div class="icon"><i class="fas fa-map-marked-alt"></i></div>
      <h4>{{ stats.totalRegions }}</h4>
      <p>Regions</p>
    </div>
    <div class="kpi-card orange">
      <div class="icon"><i class="fas fa-store"></i></div>
      <h4>{{ stats.totalShops }}</h4>
      <p>Shops</p>
    </div>
    <div class="kpi-card yellow">
      <div class="icon"><i class="fas fa-clipboard-list"></i></div>
      <h4>{{ stats.totalReports }}</h4>
      <p>Reports</p>
    </div>
  </div>

  <!-- Loading or Error -->
  <ng-template #loadingOrError>
    <div class="alert alert-danger text-center" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>
    <div class="loading text-center" *ngIf="!errorMessage">
      <div class="spinner-border text-danger" role="status"></div>
      <p class="mt-2">Loading zone details...</p>
    </div>
  </ng-template>
</div>
