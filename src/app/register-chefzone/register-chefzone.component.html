<div class="register-step-page">
  <div class="register-step-card">
    <div class="card-glow"></div>

    <div class="card-content">
      <div class="form-header">
        <div class="icon-badge">
          <i class="fas fa-map-marked-alt"></i>
        </div>
        <h1 class="form-title">Zone Chief Setup<span class="accent-dot">.</span></h1>
        <p class="form-subtitle">Select your zone and contact info</p>
      </div>

      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <!-- Zone Dropdown -->
        <div class="form-group">
          <label class="form-label" for="zoneId">Zone</label>
          <div class="input-wrapper">
            <i class="fas fa-map-pin input-icon"></i>
            <select
              id="zoneId"
              formControlName="zoneId"
              class="form-input form-select"
              [ngClass]="{'input-error': form.get('zoneId')?.touched && form.get('zoneId')?.hasError('required')}"
            >
              <option value="" disabled selected>Select a zone</option>
              <option *ngFor="let zone of availableZones" [value]="zone.idZone">
                {{ zone.libelle }} - {{ zone.gouvernorat }}
              </option>
            </select>
          </div>
          <div class="error-message" *ngIf="form.get('zoneId')?.touched && form.get('zoneId')?.hasError('required')">
            <i class="fas fa-exclamation-circle"></i> Zone is required
          </div>
        </div>

        <!-- Phone Number -->
        <div class="form-group">
          <label class="form-label" for="phone">Phone Number</label>
          <div class="input-wrapper">
            <i class="fas fa-phone input-icon"></i>
            <input
              id="phone"
              type="text"
              formControlName="phoneNumber"
              class="form-input"
              placeholder="Enter your phone number"
              [ngClass]="{'input-error': form.get('phoneNumber')?.touched && form.get('phoneNumber')?.hasError('required')}"
            />
          </div>
          <div class="error-message" *ngIf="form.get('phoneNumber')?.touched && form.get('phoneNumber')?.hasError('required')">
            <i class="fas fa-exclamation-circle"></i> Phone number is required
          </div>
        </div>

        <!-- Submit -->
        <button
          type="submit"
          class="submit-btn"
          [disabled]="form.invalid || isloading"
        >
          <span *ngIf="isloading" class="btn-loading">
            <i class="fas fa-spinner fa-spin"></i> Finishing...
          </span>
          <span *ngIf="!isloading">Finish Registration</span>
        </button>

        <!-- Error -->
        <div *ngIf="msgerror" class="alert-error">
          <i class="fas fa-exclamation-triangle"></i>
          {{ msgerror }}
        </div>
      </form>
    </div>
  </div>
</div>
