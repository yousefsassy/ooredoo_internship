<aside class="sidebar">
  <!-- Brand -->
  <div class="sidebar-brand">
    <div class="brand-mark">
      <span class="brand-icon">O</span>
      <span class="brand-text">Ooredoo</span>
    </div>
    <span class="role-badge">{{ userRole || 'Guest' }}</span>
  </div>

  <!-- Navigation -->
  <nav class="sidebar-nav">
    <ul class="nav-list">
      <li *ngFor="let link of navLinks" class="nav-item">
        <a [routerLink]="link.route" class="nav-link" routerLinkActive="active">
          <i [class]="link.iconClass" class="nav-icon"></i>
          <span class="nav-label">{{ link.label }}</span>
        </a>
      </li>
    </ul>
  </nav>

  <!-- User & Logout -->
  <div class="sidebar-footer">
    <div class="user-card">
      <div class="user-avatar">
        {{ currentUsername.charAt(0).toUpperCase() }}
      </div>
      <div class="user-meta">
        <span class="user-name">{{ currentUsername }}</span>
        <span class="user-role-label">{{ userRole || 'Guest' }}</span>
      </div>
    </div>
    <button class="logout-btn" (click)="logout()">
      <i class="fas fa-sign-out-alt"></i>
      <span class="nav-label">Log out</span>
    </button>
  </div>
</aside>

<!-- Mobile overlay backdrop -->
<div class="sidebar-backdrop"></div>

<!-- Mobile toggle button -->
<button class="mobile-sidebar-toggle">
  <i class="fas fa-bars"></i>
</button>
