<form class="zone-form" [formGroup]="zoneForm" (ngSubmit)="onSubmit()">
  <h2 class="form-title">Create a New Zone</h2>

  <!-- Secteur -->
  <div class="form-group">
    <label for="secteur">Sector <span class="required">*</span></label>
    <select id="secteur" formControlName="secteur" class="form-control">
      <option value="">-- Select a sector --</option>
      <option *ngFor="let sec of secteurs" [ngValue]="sec">{{ sec.nom }}</option>
    </select>
    <div class="error" *ngIf="zoneForm.get('secteur')?.touched && zoneForm.get('secteur')?.invalid">
      Sector is required
    </div>
  </div>

  <!-- Gouvernorat -->
  <div class="form-group">
    <label for="gouvernorat">Governorate <span class="required">*</span></label>
    <select id="gouvernorat" formControlName="gouvernorat" class="form-control" [disabled]="gouvernorats.length === 0">
      <option value="">-- Select a governorate --</option>
      <option *ngFor="let gov of gouvernorats" [value]="gov">{{ gov }}</option>
    </select>
    <div class="error" *ngIf="zoneForm.get('gouvernorat')?.touched && zoneForm.get('gouvernorat')?.invalid">
      Governorate is required
    </div>
  </div>

  <!-- Libelle -->
  <div class="form-group">
    <label for="libelle">Label (auto-generated)</label>
    <input id="libelle" formControlName="libelle" class="form-control" [disabled]="true" />
  </div>

  <!-- Submit -->
  <div class="form-actions">
    <button type="submit" class="btn-primary" [disabled]="zoneForm.invalid">Create Zone</button>
  </div>
</form>
