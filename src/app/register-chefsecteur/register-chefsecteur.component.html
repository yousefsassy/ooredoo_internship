<div class="register-step-page">
  <div class="register-step-card">
    <div class="card-glow"></div>

    <div class="card-content">
      <div class="form-header">
        <div class="icon-badge">
          <i class="fas fa-sitemap"></i>
        </div>
        <h1 class="form-title">Sector Chief Setup<span class="accent-dot">.</span></h1>
        <p class="form-subtitle">Select your sector to complete registration</p>
      </div>

      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <!-- Sector Selection -->
        <div class="form-group">
          <label class="form-label" for="secteurId">Select a Sector</label>
          <div class="input-wrapper">
            <i class="fas fa-layer-group input-icon"></i>
            <select
              id="secteurId"
              formControlName="secteurId"
              class="form-input form-select"
              [ngClass]="{'input-error': form.get('secteurId')?.invalid && form.get('secteurId')?.touched}"
            >
              <option value="" disabled>Select a sector</option>
              <option *ngFor="let secteur of secteursWithoutChef" [value]="secteur.idSecteur">
                {{ secteur.nom }}
              </option>
            </select>
          </div>
          <div class="error-message" *ngIf="form.get('secteurId')?.invalid && form.get('secteurId')?.touched">
            <i class="fas fa-exclamation-circle"></i> Sector selection is required
          </div>
        </div>

        <!-- Error Message -->
        <div *ngIf="msgerror" class="alert-error">
          <i class="fas fa-exclamation-triangle"></i>
          {{ msgerror }}
        </div>

        <!-- Submit -->
        <button
          type="submit"
          class="submit-btn"
          [disabled]="isloading || form.invalid"
        >
          <span *ngIf="isloading" class="btn-loading">
            <i class="fas fa-spinner fa-spin"></i> Registering...
          </span>
          <span *ngIf="!isloading">Complete Registration</span>
        </button>
      </form>
    </div>
  </div>
</div>
