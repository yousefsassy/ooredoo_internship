<div class="page-container">
  <!-- Page Header -->
  <div class="page-header">
    <div>
      <h1 class="page-title">Regions Management</h1>
      <p class="page-subtitle">View and manage regions in your zone</p>
    </div>
    <button class="btn-add" (click)="onAddRegion()">
      <i class="fas fa-plus"></i> Add Region
    </button>
  </div>

  <!-- Error Banner -->
  <div *ngIf="errorMessage" class="error-banner">
    <div class="error-icon"><i class="fas fa-exclamation-circle"></i></div>
    <div class="error-content">
      <span class="error-title">Error</span>
      <span class="error-text">{{ errorMessage }}</span>
    </div>
  </div>

  <!-- Controls Bar -->
  <div class="controls-bar">
    <div class="search-box">
      <i class="fas fa-search"></i>
      <input
        type="text"
        placeholder="Search by region name, delegation..."
        [(ngModel)]="searchTerm"
        (input)="onSearchChange()"
      />
    </div>
  </div>

  <!-- Table Card -->
  <div class="table-card">
    <div class="table-responsive">
      <table class="data-table" *ngIf="filteredRegions.length > 0; else emptyState">
        <thead>
          <tr>
            <th>Region Name</th>
            <th>Delegation</th>
            <th>Region Manager</th>
            <th class="th-actions">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let region of filteredRegions">
            <td>
              <div class="entity-info">
                <div class="entity-icon">
                  <i class="fas fa-map-marker-alt"></i>
                </div>
                <span class="entity-name">{{ region.nom }}</span>
              </div>
            </td>
            <td class="td-secondary">{{ region.delegation }}</td>
            <td class="td-secondary">{{ region.chefRegion?.username || 'N/A' }}</td>
            <td>
              <div class="action-buttons">
                <button class="action-btn" (click)="onViewRegion(region.idRegion!)" title="View">
                  <i class="fas fa-eye"></i>
                </button>
                <button class="action-btn" (click)="onEditRegion(region.idRegion!)" title="Edit">
                  <i class="fas fa-pen"></i>
                </button>
                <button class="action-btn action-btn-danger" (click)="onDeleteRegion(region.idRegion!)" title="Delete">
                  <i class="fas fa-trash"></i>
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <ng-template #emptyState>
      <div class="empty-state">
        <div class="empty-icon">
          <i class="fas fa-map-marker-alt"></i>
        </div>
        <h3>No regions found</h3>
        <p>Start by adding your first region</p>
        <button class="btn-add" (click)="onAddRegion()">
          <i class="fas fa-plus"></i> Add Region
        </button>
      </div>
    </ng-template>
  </div>
</div>
