<!-- Loading State -->
<div *ngIf="isLoading" class="loading-state">
  <div class="spinner-ring"></div>
  <p>Loading user details...</p>
</div>

<!-- Error Banner -->
<div *ngIf="error" class="error-banner">
  <div class="error-icon">
    <i class="fas fa-exclamation-circle"></i>
  </div>
  <div class="error-content">
    <span class="error-title">Error</span>
    <span class="error-text">{{ error }}</span>
  </div>
</div>

<!-- Main Content -->
<div *ngIf="!isLoading && user" class="page-container">
  <div class="detail-header">
    <div class="detail-icon">
      <i class="fas fa-user"></i>
    </div>
    <div class="detail-header-info">
      <h1 class="detail-title">{{ user.username }}</h1>
    </div>
  </div>

  <div class="meta-grid">
    <!-- ID -->
    <div class="meta-item">
      <i class="fas fa-hashtag"></i>
      <div class="meta-content">
        <span class="meta-label">User ID</span>
        <span class="meta-value">{{ user.id }}</span>
      </div>
    </div>

    <!-- Email -->
    <div class="meta-item">
      <i class="fas fa-envelope"></i>
      <div class="meta-content">
        <span class="meta-label">Email</span>
        <span class="meta-value">{{ user.email }}</span>
      </div>
    </div>

    <!-- Role -->
    <div class="meta-item">
      <i class="fas fa-shield-alt"></i>
      <div class="meta-content">
        <span class="meta-label">Role</span>
        <span class="meta-value">{{ user.roleName }}</span>
      </div>
    </div>

    <!-- Status -->
    <div class="meta-item">
      <i class="fas fa-circle"></i>
      <div class="meta-content">
        <span class="meta-label">Status</span>
        <span class="meta-value" [ngClass]="{'status-active': user.enabled, 'status-inactive': !user.enabled}">
          {{ user.enabled ? 'Active' : 'Inactive' }}
        </span>
      </div>
    </div>

    <!-- Account Locked -->
    <div class="meta-item">
      <i class="fas fa-lock"></i>
      <div class="meta-content">
        <span class="meta-label">Account Locked</span>
        <span class="meta-value">{{ user.accountLocked ? 'Yes' : 'No' }}</span>
      </div>
    </div>
  </div>
</div>
