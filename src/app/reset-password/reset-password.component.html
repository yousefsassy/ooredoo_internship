<div class="reset-page">
  <div class="reset-card">
    <div class="card-glow"></div>

    <div class="card-content">
      <div class="form-header">
        <div class="icon-badge">
          <i class="fas fa-lock"></i>
        </div>
        <h1 class="form-title">Reset Password<span class="accent-dot">.</span></h1>
        <p class="form-subtitle">Choose a new secure password for your account</p>
      </div>

      <form [formGroup]="resetForm" (ngSubmit)="submit()">
        <!-- Password Field -->
        <div class="form-group">
          <label class="form-label">New Password</label>
          <div class="input-wrapper">
            <i class="fas fa-lock input-icon"></i>
            <input
              [type]="showPassword ? 'text' : 'password'"
              formControlName="password"
              class="form-input"
              placeholder="New password"
              [ngClass]="{
                'input-error': password.invalid && (password.dirty || password.touched)
              }"
            />
            <i
              class="fas password-toggle"
              [class.fa-eye]="!showPassword"
              [class.fa-eye-slash]="showPassword"
              (click)="togglePasswordVisibility()"
            ></i>
          </div>
          <div *ngIf="password.invalid && (password.dirty || password.touched)" class="error-message">
            <i class="fas fa-exclamation-circle"></i>
            <div>
              <div *ngIf="password.errors?.['required']">Password is required</div>
              <div *ngIf="password.errors?.['passwordStrength']">
                Password must be at least 6 characters, include an uppercase letter and a number
              </div>
            </div>
          </div>
        </div>

        <!-- Confirm Password Field -->
        <div class="form-group">
          <label class="form-label">Confirm Password</label>
          <div class="input-wrapper">
            <i class="fas fa-lock input-icon"></i>
            <input
              [type]="showConfirmPassword ? 'text' : 'password'"
              formControlName="confirmPassword"
              class="form-input"
              placeholder="Confirm password"
              [ngClass]="{
                'input-error': resetForm.errors?.['passwordMismatch'] &&
                               (confirmPassword.dirty || confirmPassword.touched)
              }"
            />
          </div>
          <div *ngIf="resetForm.errors?.['passwordMismatch'] &&
                     (confirmPassword.dirty || confirmPassword.touched)" class="error-message">
            <i class="fas fa-exclamation-circle"></i>
            Passwords do not match
          </div>
        </div>

        <!-- Error Message -->
        <div *ngIf="errorMessage" class="alert-message alert-error">
          <i class="fas fa-exclamation-triangle"></i>
          {{ errorMessage }}
        </div>

        <!-- Success Message -->
        <div *ngIf="successMessage" class="alert-message alert-success">
          <i class="fas fa-check-circle"></i>
          {{ successMessage }}
        </div>

        <!-- Submit Button -->
        <button
          type="submit"
          class="submit-btn"
          [disabled]="resetForm.invalid || isLoading"
        >
          <span *ngIf="!isLoading">Reset Password</span>
          <span *ngIf="isLoading" class="btn-loading">
            <i class="fas fa-spinner fa-spin"></i> Processing...
          </span>
        </button>
      </form>
    </div>
  </div>
</div>
