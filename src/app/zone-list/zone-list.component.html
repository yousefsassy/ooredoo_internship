<div class="page-container">
  <!-- Page Header -->
  <div class="page-header">
    <div>
      <h1 class="page-title">Zones</h1>
      <p class="page-subtitle">Browse and manage all zones</p>
    </div>
    <button class="btn-add" (click)="onAddZone()">
      <i class="fas fa-plus"></i> Add Zone
    </button>
  </div>

  <!-- Controls Bar -->
  <div class="controls-bar">
    <div class="search-box">
      <i class="fas fa-search"></i>
      <input
        type="text"
        [(ngModel)]="searchTerm"
        (input)="onSearchChange()"
        placeholder="Search zones..."
      />
    </div>
    <div class="filter-dropdown">
      <select [(ngModel)]="filterGovernorate" (change)="onGovernorateChange()">
        <option value="">All Governorates</option>
        <option *ngFor="let gov of governorates" [value]="gov">{{ gov }}</option>
      </select>
    </div>
  </div>

  <!-- Cards Grid -->
  <div class="cards-grid" *ngIf="filteredZones.length > 0; else emptyState">
    <div class="zone-card" *ngFor="let zone of filteredZones">
      <div class="card-top">
        <div class="card-icon">
          <i class="fas fa-map-pin"></i>
        </div>
        <div class="card-info">
          <h3 class="card-title">{{ zone.libelle }}</h3>
          <span class="card-meta">
            <i class="fas fa-building"></i>
            {{ zone.gouvernorat }}
          </span>
        </div>
      </div>
      <div class="card-actions" *ngIf="zone.idZone != null">
        <button
          class="action-btn"
          (click)="onViewZone(zone.idZone!)"
          title="View zone"
        >
          <i class="fas fa-eye"></i>
        </button>
        <button
          class="action-btn"
          (click)="onEditZone(zone.idZone!)"
          title="Edit zone"
        >
          <i class="fas fa-pen"></i>
        </button>
        <button
          class="action-btn action-btn-danger"
          (click)="onArchiveZone(zone.idZone!)"
          title="Archive zone"
        >
          <i class="fas fa-archive"></i>
        </button>
      </div>
    </div>
  </div>

  <ng-template #emptyState>
    <div class="empty-state">
      <div class="empty-icon">
        <i class="fas fa-map-marked-alt"></i>
      </div>
      <h3>No zones found</h3>
      <p>Try adjusting your search or filters</p>
      <button class="btn-add" (click)="onAddZone()">
        <i class="fas fa-plus"></i> Add Zone
      </button>
    </div>
  </ng-template>
</div>
