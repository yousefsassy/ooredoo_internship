<div class="page-container">
  <div class="page-header">
    <h1 class="page-title">Create Shop</h1>
    <p class="page-subtitle">Add a new shop to the network</p>
  </div>

  <div class="form-card">
    <form [formGroup]="shopForm" (ngSubmit)="onSubmit()">

      <!-- Shop Name -->
      <div class="form-group">
        <label class="form-label" for="nomShop">Shop Name</label>
        <div class="input-wrapper">
          <i class="fas fa-store input-icon"></i>
          <input
            id="nomShop"
            type="text"
            class="form-input"
            [class.input-error]="shopForm.get('nomShop')?.invalid && shopForm.get('nomShop')?.touched"
            formControlName="nomShop"
            placeholder="Enter shop name"
          />
        </div>
        <div
          *ngIf="shopForm.get('nomShop')?.invalid && shopForm.get('nomShop')?.touched"
          class="error-message"
        >
          <i class="fas fa-exclamation-circle"></i>
          Shop name is required.
        </div>
      </div>

      <!-- Phone Number -->
      <div class="form-group">
        <label class="form-label" for="telephone">Phone Number</label>
        <div class="input-wrapper">
          <i class="fas fa-phone input-icon"></i>
          <input
            id="telephone"
            type="text"
            class="form-input"
            [class.input-error]="shopForm.get('telephone')?.invalid && shopForm.get('telephone')?.touched"
            formControlName="telephone"
            placeholder="Enter phone number"
          />
        </div>
        <div
          *ngIf="shopForm.get('telephone')?.invalid && shopForm.get('telephone')?.touched"
          class="error-message"
        >
          <i class="fas fa-exclamation-circle"></i>
          Phone number is required.
        </div>
      </div>

      <!-- Region -->
      <div class="form-group">
        <label class="form-label" for="region">Region</label>
        <div class="input-wrapper">
          <i class="fas fa-globe-africa input-icon"></i>
          <select
            id="region"
            class="form-input form-select"
            [class.input-error]="shopForm.get('region')?.invalid && shopForm.get('region')?.touched"
            formControlName="region"
          >
            <option [ngValue]="null" disabled selected>-- Select a region --</option>
            <option *ngFor="let r of regions" [ngValue]="r">{{ r.nom }} ({{ r.delegation }})</option>
          </select>
        </div>
        <div
          *ngIf="shopForm.get('region')?.invalid && shopForm.get('region')?.touched"
          class="error-message"
        >
          <i class="fas fa-exclamation-circle"></i>
          Region is required.
        </div>
      </div>

      <!-- Submit -->
      <button type="submit" class="submit-btn" [disabled]="shopForm.invalid">
        <i class="fas fa-plus-circle"></i>
        Create Shop
      </button>

    </form>
  </div>
</div>
