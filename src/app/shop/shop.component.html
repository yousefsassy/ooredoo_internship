<form [formGroup]="shopForm" (ngSubmit)="onSubmit()" class="shop-form">

  <div class="form-group">
    <label for="nomShop">Shop Name:</label>
    <input id="nomShop" formControlName="nomShop" placeholder="Enter shop name" />
    <div *ngIf="shopForm.get('nomShop')?.invalid && shopForm.get('nomShop')?.touched" class="error-msg">
      Shop name is required.
    </div>
  </div>

  <div class="form-group">
    <label for="telephone">Phone Number:</label>
    <input id="telephone" formControlName="telephone" placeholder="Enter phone number" />
    <div *ngIf="shopForm.get('telephone')?.invalid && shopForm.get('telephone')?.touched" class="error-msg">
      Phone number is required.
    </div>
  </div>

  <div class="form-group">
    <label for="region">Region:</label>
    <select id="region" formControlName="region">
      <option [ngValue]="null" disabled selected>-- Select a region --</option>
      <option *ngFor="let r of regions" [ngValue]="r">{{ r.nom }} ({{ r.delegation }})</option>
    </select>
    <div *ngIf="shopForm.get('region')?.invalid && shopForm.get('region')?.touched" class="error-msg">
      Region is required.
    </div>
  </div>

  <button type="submit" [disabled]="shopForm.invalid" class="btn-submit">Create Shop</button>

</form>
