<div class="page-container">
  <div class="page-header">
    <div>
      <h1 class="page-title">Shops in Your Region</h1>
      <p class="page-subtitle">View and manage shops assigned to your region</p>
    </div>
  </div>

  <div *ngIf="errorMessage" class="error-banner">
    <div class="error-icon">
      <i class="fas fa-exclamation-circle"></i>
    </div>
    <div class="error-content">
      <span class="error-title">Error</span>
      <span class="error-text">{{ errorMessage }}</span>
    </div>
  </div>

  <div class="controls-bar">
    <div class="search-box">
      <i class="fas fa-search"></i>
      <input
        type="text"
        placeholder="Search shops..."
        [(ngModel)]="searchTerm"
        (input)="filterShops()"
      />
    </div>
  </div>

  <div class="table-card">
    <div class="table-responsive">
      <table class="data-table" *ngIf="filteredShops.length > 0; else emptyState">
        <thead>
          <tr>
            <th>Shop Name</th>
            <th>Admin</th>
            <th>Phone</th>
            <th class="th-actions">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let shop of filteredShops">
            <td>
              <div class="entity-info">
                <div class="entity-icon">
                  <i class="fas fa-store"></i>
                </div>
                <span class="entity-name">{{ shop.nomShop }}</span>
              </div>
            </td>
            <td class="td-secondary">{{ shop.adminShop?.username || 'N/A' }}</td>
            <td class="td-secondary">{{ shop.telephone }}</td>
            <td>
              <div class="action-buttons">
                <button class="action-btn" (click)="viewShop(shop.idShop)" title="View">
                  <i class="fas fa-eye"></i>
                </button>
                <button class="action-btn action-btn-warning" (click)="reportShop(shop.idShop)" title="Report">
                  <i class="fas fa-flag"></i>
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <ng-template #emptyState>
      <div class="empty-state">
        <div class="empty-icon">
          <i class="fas fa-store"></i>
        </div>
        <h3>No shops found</h3>
        <p>This region has no registered shops yet.</p>
      </div>
    </ng-template>
  </div>
</div>
