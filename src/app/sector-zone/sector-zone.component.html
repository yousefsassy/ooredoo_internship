<div class="page-container">
  <!-- Page Header -->
  <div class="page-header">
    <div>
      <h1 class="page-title">Zones Management</h1>
      <p class="page-subtitle">View and manage zones in your sector</p>
    </div>
    <button class="btn-add" (click)="onAddZone()">
      <i class="fas fa-plus"></i> Add Zone
    </button>
  </div>

  <!-- Error Banner -->
  <div *ngIf="errorMessage" class="error-banner">
    <div class="error-icon"><i class="fas fa-exclamation-circle"></i></div>
    <div class="error-content">
      <span class="error-title">Error</span>
      <span class="error-text">{{ errorMessage }}</span>
    </div>
  </div>

  <!-- Controls Bar -->
  <div class="controls-bar">
    <div class="search-box">
      <i class="fas fa-search"></i>
      <input
        type="text"
        placeholder="Search by zone label..."
        [(ngModel)]="searchTerm"
        (input)="onSearchChange()"
      />
    </div>
    <div class="filter-box">
      <select
        class="filter-select"
        [(ngModel)]="filterGovernorate"
        (change)="onGovernorateChange()"
      >
        <option value="">All Governorates</option>
        <option *ngFor="let gov of governorates" [value]="gov">{{ gov }}</option>
      </select>
    </div>
  </div>

  <!-- Table Card -->
  <div class="table-card">
    <div class="table-responsive">
      <table class="data-table" *ngIf="filteredZones.length > 0; else emptyState">
        <thead>
          <tr>
            <th>Zone Label</th>
            <th>Governorate</th>
            <th class="th-actions">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let zone of filteredZones">
            <td>
              <div class="entity-info">
                <div class="entity-icon">
                  <i class="fas fa-map-pin"></i>
                </div>
                <span class="entity-name">{{ zone.libelle }}</span>
              </div>
            </td>
            <td class="td-secondary">{{ zone.gouvernorat }}</td>
            <td>
              <div class="action-buttons">
                <button class="action-btn" (click)="onViewZone(zone.idZone!)" title="View">
                  <i class="fas fa-eye"></i>
                </button>
                <button class="action-btn" (click)="onEditZone(zone.idZone!)" title="Edit">
                  <i class="fas fa-pen"></i>
                </button>
                <button class="action-btn action-btn-danger" (click)="onDeleteZone(zone.idZone!)" title="Delete">
                  <i class="fas fa-trash"></i>
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <ng-template #emptyState>
      <div class="empty-state">
        <div class="empty-icon">
          <i class="fas fa-map-pin"></i>
        </div>
        <h3>No zones found</h3>
        <p>Start by adding your first zone</p>
        <button class="btn-add" (click)="onAddZone()">
          <i class="fas fa-plus"></i> Add Zone
        </button>
      </div>
    </ng-template>
  </div>
</div>
