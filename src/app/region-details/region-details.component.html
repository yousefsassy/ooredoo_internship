<div *ngIf="isLoading" class="loading-state">
  <div class="spinner-ring"></div>
  <p>Loading region details...</p>
</div>

<div *ngIf="error" class="error-banner">
  <div class="error-icon"><i class="fas fa-exclamation-circle"></i></div>
  <div class="error-content">
    <span class="error-title">Error</span>
    <span class="error-text">{{ error }}</span>
  </div>
</div>

<div *ngIf="!isLoading && region" class="page-container">
  <!-- Region Header -->
  <div class="detail-header">
    <div class="detail-icon">
      <i class="fas fa-map-signs"></i>
    </div>
    <div class="detail-header-info">
      <h1 class="detail-title">{{ region.nom }}</h1>
    </div>
  </div>

  <!-- Meta Grid -->
  <div class="meta-grid">
    <div class="meta-item">
      <i class="fas fa-hashtag"></i>
      <div class="meta-content">
        <span class="meta-label">Region ID</span>
        <span class="meta-value">{{ region.idRegion }}</span>
      </div>
    </div>
    <div class="meta-item">
      <i class="fas fa-city"></i>
      <div class="meta-content">
        <span class="meta-label">Delegation</span>
        <span class="meta-value">{{ region.delegation }}</span>
      </div>
    </div>
    <div class="meta-item">
      <i class="fas fa-map-pin"></i>
      <div class="meta-content">
        <span class="meta-label">Zone</span>
        <span class="meta-value">{{ region.zone?.libelle || 'N/A' }}</span>
      </div>
    </div>
    <div class="meta-item">
      <i class="fas fa-user-tie"></i>
      <div class="meta-content">
        <span class="meta-label">Chef Region</span>
        <span class="meta-value">{{ region.chefRegion?.nom || 'Not assigned' }}</span>
      </div>
    </div>
    <div class="meta-item">
      <i class="fas fa-store"></i>
      <div class="meta-content">
        <span class="meta-label">Total Shops</span>
        <span class="meta-value">{{ region.shops?.length || 0 }}</span>
      </div>
    </div>
  </div>
</div>
