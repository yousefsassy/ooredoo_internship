<div class="forgot-page">
  <div class="forgot-card">
    <div class="card-glow"></div>

    <div class="card-content">
      <div class="form-header">
        <div class="icon-badge">
          <i class="fas fa-envelope"></i>
        </div>
        <h1 class="form-title">Password Recovery<span class="accent-dot">.</span></h1>
        <p class="form-subtitle">Enter your email to reset your password</p>
      </div>

      <!-- Success Message -->
      <div *ngIf="successMessage" class="alert-message alert-success">
        <i class="fas fa-check-circle"></i>
        {{ successMessage }}
      </div>

      <!-- Error Message -->
      <div *ngIf="errorMessage" class="alert-message alert-error">
        <i class="fas fa-exclamation-triangle"></i>
        {{ errorMessage }}
      </div>

      <!-- Form -->
      <form [formGroup]="forgotForm" (ngSubmit)="submit()">
        <div class="form-group">
          <label for="email" class="form-label">Email address</label>
          <div class="input-wrapper">
            <i class="fas fa-envelope input-icon"></i>
            <input
              id="email"
              type="email"
              formControlName="email"
              class="form-input"
              placeholder="Enter your email"
              [ngClass]="{
                'input-error':
                  forgotForm.get('email')?.invalid &&
                  forgotForm.get('email')?.touched
              }"
              required
            />
          </div>
          <div
            *ngIf="
              forgotForm.get('email')?.invalid && forgotForm.get('email')?.touched
            "
            class="error-message"
          >
            <i class="fas fa-exclamation-circle"></i>
            Valid email is required
          </div>
        </div>

        <button
          class="submit-btn"
          type="submit"
          [disabled]="forgotForm.invalid || isLoading"
        >
          <span *ngIf="!isLoading">Send Reset Instructions</span>
          <span *ngIf="isLoading" class="btn-loading">
            <i class="fas fa-spinner fa-spin"></i>
            Processing...
          </span>
        </button>

        <div class="alt-link">
          <a routerLink="/login"><i class="fas fa-arrow-left"></i> Back to Login</a>
        </div>
      </form>
    </div>
  </div>
</div>
