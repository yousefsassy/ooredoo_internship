<!-- Ooredoo Forgot Password Layout -->
<div class="ooredoo-login-container">
  <section class="ooredoo-login-card animate-fade-in">
    <div class="ooredoo-login-header">
      <img
        src="assets/ooredoo logo.png"
        alt="Ooredoo Logo"
        style="width: 100px; height: auto; margin-bottom: 12px"
      />
      <h2>Password Recovery</h2>
      <p class="subheading">Enter your email to reset your password</p>
    </div>

    <!-- Success Message -->
    <div *ngIf="successMessage" class="ooredoo-alert-success">
      {{ successMessage }}
    </div>

    <!-- Error Message -->
    <div *ngIf="errorMessage" class="ooredoo-alert-error">
      {{ errorMessage }}
    </div>

    <!-- Form -->
    <form [formGroup]="forgotForm" (ngSubmit)="submit()">
      <div class="ooredoo-form-group">
        <label for="email">Email address</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          class="ooredoo-input"
          placeholder="Enter your email"
          [ngClass]="{
            'ooredoo-input-error':
              forgotForm.get('email')?.invalid &&
              forgotForm.get('email')?.touched
          }"
          required
        />
        <div
          *ngIf="
            forgotForm.get('email')?.invalid && forgotForm.get('email')?.touched
          "
          class="ooredoo-error-message"
        >
          Valid email is required
        </div>
      </div>

      <button
        class="ooredoo-submit-btn"
        type="submit"
        [disabled]="forgotForm.invalid || isLoading"
      >
        <span *ngIf="!isLoading">Send Reset Instructions</span>
        <span *ngIf="isLoading">
          <i class="fas fa-spinner fa-spin"></i>
          Processing...
        </span>
      </button>

      <div class="ooredoo-register-link">
        <a routerLink="/login">← Back to Login</a>
      </div>
    </form>
  </section>
</div>
