<!-- Loading State -->
<div *ngIf="!zoneLoaded" class="loading-state">
  <div class="spinner-ring"></div>
  <p>Loading zone data...</p>
</div>

<!-- Main Content -->
<div *ngIf="zoneLoaded" class="page-container">
  <div class="page-header">
    <h1 class="page-title">Edit Zone</h1>
    <p class="page-subtitle">Update zone information</p>
  </div>

  <div class="form-card">
    <form [formGroup]="zoneForm" (ngSubmit)="onSubmit()">
      <!-- Label -->
      <div class="form-group">
        <label class="form-label" for="libelle">Label</label>
        <div class="input-wrapper">
          <i class="fas fa-tag input-icon"></i>
          <input
            id="libelle"
            class="form-input"
            formControlName="libelle"
            placeholder="Enter zone label"
          />
        </div>
      </div>

      <!-- Governorate -->
      <div class="form-group">
        <label class="form-label" for="gouvernorat">Governorate</label>
        <div class="input-wrapper">
          <i class="fas fa-city input-icon"></i>
          <input
            id="gouvernorat"
            class="form-input"
            formControlName="gouvernorat"
            placeholder="Enter governorate"
          />
        </div>
      </div>

      <!-- Delegation -->
      <div class="form-group">
        <label class="form-label" for="delegation">Delegation</label>
        <div class="input-wrapper">
          <i class="fas fa-map-marker-alt input-icon"></i>
          <input
            id="delegation"
            class="form-input"
            formControlName="delegation"
            placeholder="Enter delegation"
          />
        </div>
      </div>

      <!-- Address -->
      <div class="form-group">
        <label class="form-label" for="adresse">Address</label>
        <div class="input-wrapper">
          <i class="fas fa-map-pin input-icon"></i>
          <input
            id="adresse"
            class="form-input"
            formControlName="adresse"
            placeholder="Enter address"
          />
        </div>
      </div>

      <!-- Submit -->
      <button type="submit" class="submit-btn" [disabled]="zoneForm.invalid">
        <i class="fas fa-save"></i>
        Update Zone
      </button>
    </form>
  </div>
</div>
