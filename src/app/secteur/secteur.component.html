<form [formGroup]="secteurForm" (ngSubmit)="onSubmit()" class="secteur-create-container">
  <h2>Create a New Sector</h2>

  <div class="form-group">
    <label for="sector-select">Select a Sector</label>
    <select id="sector-select" formControlName="nom" class="form-control" required>
      <option value="" disabled selected>-- Choose a sector --</option>
      <option *ngFor="let sector of availableSectors" [value]="sector">
        {{ sector }}
      </option>
    </select>
    <div *ngIf="secteurForm.controls['nom'].invalid && secteurForm.controls['nom'].touched" class="error">
      Please select a sector.
    </div>
  </div>

  <button
    type="submit"
    [disabled]="secteurForm.invalid || loading"
    class="btn btn-danger btn-block mt-3"
  >
    {{ loading ? 'Creating...' : 'Create Sector' }}
  </button>

  <div *ngIf="successMessage" class="alert alert-success mt-3">{{ successMessage }}</div>
  <div *ngIf="errorMessage" class="alert alert-danger mt-3">{{ errorMessage }}</div>
</form>

<!-- Sector Details Display -->
<div *ngIf="secteurForm.value.nom" class="mt-4 secteur-details">
  <h4>Details for {{ secteurForm.value.nom }}</h4>
  <ul>
    <li *ngFor="let governorate of sectorsDetail[secteurForm.value.nom]">
      <strong>{{ governorate.name }}:</strong>
      <ul>
        <li *ngFor="let delegation of governorate.delegations">{{ delegation }}</li>
      </ul>
    </li>
  </ul>
</div>
