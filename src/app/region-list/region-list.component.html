<div class="page-container">
  <!-- Page Header -->
  <div class="page-header">
    <div>
      <h1 class="page-title">Regions</h1>
      <p class="page-subtitle">Browse and manage all regions</p>
    </div>
    <button class="btn-add" (click)="onAddRegion()">
      <i class="fas fa-plus"></i> Add Region
    </button>
  </div>

  <!-- Controls Bar -->
  <div class="controls-bar">
    <div class="search-box">
      <i class="fas fa-search"></i>
      <input
        type="text"
        placeholder="Search by name, delegation or zone..."
        [(ngModel)]="searchTerm"
        (input)="onSearchChange()"
      />
    </div>
  </div>

  <!-- Loading -->
  <div *ngIf="loading" class="loading-state">
    <i class="fas fa-spinner fa-spin"></i>
    <span>Loading regions...</span>
  </div>

  <!-- Error -->
  <div *ngIf="errorMessage" class="error-banner">
    <i class="fas fa-exclamation-circle"></i>
    {{ errorMessage }}
  </div>

  <!-- Cards Grid -->
  <div class="cards-grid" *ngIf="!loading && filteredRegions.length > 0">
    <div *ngFor="let region of filteredRegions" class="region-card">
      <div class="card-top">
        <div class="card-icon">
          <i class="fas fa-map-marked-alt"></i>
        </div>
        <div class="card-info">
          <h3 class="card-title">{{ region.nom }}</h3>
          <span class="card-meta">
            <i class="fas fa-building"></i>
            {{ region.delegation }}
          </span>
        </div>
      </div>
      <div class="card-actions">
        <button
          class="action-btn"
          (click)="onViewRegion(region.idRegion!)"
          title="View details"
        >
          <i class="fas fa-eye"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- Empty State -->
  <div class="empty-state" *ngIf="!loading && filteredRegions.length === 0 && !errorMessage">
    <div class="empty-icon">
      <i class="fas fa-map-marked-alt"></i>
    </div>
    <h3>No regions found</h3>
    <p>Try adjusting your search or add a new region</p>
    <button class="btn-add" (click)="onAddRegion()">
      <i class="fas fa-plus"></i> Add Region
    </button>
  </div>
</div>
