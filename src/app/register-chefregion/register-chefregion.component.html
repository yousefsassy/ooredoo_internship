<div class="register-step-page">
  <div class="register-step-card">
    <div class="card-glow"></div>

    <div class="card-content">
      <div class="form-header">
        <div class="icon-badge">
          <i class="fas fa-map-signs"></i>
        </div>
        <h1 class="form-title">Region Chief Setup<span class="accent-dot">.</span></h1>
        <p class="form-subtitle">Select your region and contact info</p>
      </div>

      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <!-- Region Dropdown -->
        <div class="form-group">
          <label class="form-label" for="regionId">Region</label>
          <div class="input-wrapper">
            <i class="fas fa-globe-africa input-icon"></i>
            <select
              id="regionId"
              formControlName="regionId"
              class="form-input form-select"
              [ngClass]="{'input-error': form.get('regionId')?.touched && form.get('regionId')?.hasError('required')}"
            >
              <option value="" disabled selected>Select a region</option>
              <option *ngFor="let region of availableRegions" [value]="region.idRegion">
                {{ region.nom }} - {{ region.delegation }}
              </option>
            </select>
          </div>
          <div class="error-message" *ngIf="form.get('regionId')?.touched && form.get('regionId')?.hasError('required')">
            <i class="fas fa-exclamation-circle"></i> Region is required
          </div>
        </div>

        <!-- Phone Number -->
        <div class="form-group">
          <label class="form-label" for="phone">Phone Number</label>
          <div class="input-wrapper">
            <i class="fas fa-phone input-icon"></i>
            <input
              id="phone"
              type="text"
              formControlName="phoneNumber"
              class="form-input"
              placeholder="Enter your phone number"
              [ngClass]="{'input-error': form.get('phoneNumber')?.touched && form.get('phoneNumber')?.hasError('required')}"
            />
          </div>
          <div class="error-message" *ngIf="form.get('phoneNumber')?.touched && form.get('phoneNumber')?.hasError('required')">
            <i class="fas fa-exclamation-circle"></i> Phone number is required
          </div>
        </div>

        <!-- Submit -->
        <button
          type="submit"
          class="submit-btn"
          [disabled]="form.invalid || isLoading"
        >
          <span *ngIf="isLoading" class="btn-loading">
            <i class="fas fa-spinner fa-spin"></i> Finishing...
          </span>
          <span *ngIf="!isLoading">Finish Registration</span>
        </button>

        <!-- Error -->
        <div *ngIf="errorMsg" class="alert-error">
          <i class="fas fa-exclamation-triangle"></i>
          {{ errorMsg }}
        </div>
      </form>
    </div>
  </div>
</div>
