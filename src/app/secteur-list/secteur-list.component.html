<div class="page-container">
  <!-- Page Header -->
  <div class="page-header">
    <div>
      <h1 class="page-title">Sectors</h1>
      <p class="page-subtitle">Browse and manage all sectors</p>
    </div>
    <button class="btn-add" (click)="onAddSecteur()">
      <i class="fas fa-plus"></i> Add Sector
    </button>
  </div>

  <!-- Controls Bar -->
  <div class="controls-bar">
    <div class="search-box">
      <i class="fas fa-search"></i>
      <input
        type="text"
        placeholder="Search by sector name..."
        [(ngModel)]="searchTerm"
        (input)="onSearchChange()"
      />
    </div>
  </div>

  <!-- Loading -->
  <div *ngIf="loading" class="loading-state">
    <i class="fas fa-spinner fa-spin"></i>
    <span>Loading sectors...</span>
  </div>

  <!-- Error -->
  <div *ngIf="errorMessage" class="error-banner">
    <i class="fas fa-exclamation-circle"></i>
    {{ errorMessage }}
  </div>

  <!-- Cards Grid -->
  <div class="cards-grid" *ngIf="!loading && filteredSecteurs.length > 0">
    <div *ngFor="let secteur of filteredSecteurs" class="secteur-card">
      <div class="card-top">
        <div class="card-icon">
          <i class="fas fa-layer-group"></i>
        </div>
        <div class="card-info">
          <h3 class="card-title">{{ secteur.nom }}</h3>
          <span class="card-meta">
            <i class="fas fa-user-tie"></i>
            {{ secteur.chefSecteur?.prenom || '' }} {{ secteur.chefSecteur?.nom || 'Not assigned' }}
          </span>
        </div>
      </div>
      <div class="card-actions">
        <button
          class="action-btn"
          (click)="onViewSecteur(secteur)"
          title="View details"
        >
          <i class="fas fa-eye"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- Empty State -->
  <div class="empty-state" *ngIf="!loading && filteredSecteurs.length === 0 && !errorMessage">
    <div class="empty-icon">
      <i class="fas fa-layer-group"></i>
    </div>
    <h3>No sectors found</h3>
    <p>Try adjusting your search or add a new sector</p>
    <button class="btn-add" (click)="onAddSecteur()">
      <i class="fas fa-plus"></i> Add Sector
    </button>
  </div>
</div>
